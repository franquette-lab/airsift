<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HareSync • Mobile</title>

  <style>
    :root { 
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; min-height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 16px; border-bottom: 1px solid #334155; margin-bottom: 20px;
    }
    h1 { font-size: 1.25rem; margin: 0; display: flex; align-items: center; gap: 8px; }
    .status-badge {
      font-size: 0.75rem; padding: 4px 10px; border-radius: 999px;
      background: #334155; color: var(--muted); font-weight: 600;
    }
    .status-badge.online { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .status-badge.error { background: rgba(239, 68, 68, 0.2); color: var(--error); }

    .send-box {
      background: var(--card); padding: 16px; border-radius: 14px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); margin-bottom: 24px;
    }
    .input-group {
      display: flex; align-items: stretch; gap: 8px; margin-bottom: 12px; width: 100%;
    }
    input[type="url"] {
      flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid #475569;
      background: #0f172a; color: var(--text); font-size: 1rem; outline: none;
    }
    input[type="url"]:focus { border-color: var(--accent); }
    button {
      padding: 12px 16px; border-radius: 10px; border: none; font-weight: 600;
      font-size: 0.95rem; cursor: pointer;
    }
    button:active { opacity: 0.7; }
    .btn-paste {
      background: #334155; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 0 14px; flex-shrink: 0;
    }
    .btn-send { background: var(--accent); color: white; width: 100%; }
    
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 0 12px 0;
    }
    h2 { font-size: 0.9rem; color: var(--muted); margin: 0; text-transform: uppercase; letter-spacing: 0.05em; }
    .btn-clear-all {
      background: transparent; color: var(--error); padding: 4px 8px;
      font-size: 0.8rem; border-radius: 6px;
    }
    .btn-clear-all:hover { background: rgba(239, 68, 68, 0.15); }

    .links-list { display: flex; flex-direction: column; gap: 10px; }
    .link-card {
      background: var(--card); padding: 14px; border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      border-left: 4px solid var(--accent);
    }
    .link-info { overflow: hidden; flex: 1; }
    .link-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .link-url { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    
    .link-actions {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .btn-open {
      background: rgba(59, 130, 246, 0.15); color: var(--accent);
      text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    }
    .btn-delete {
      background: rgba(239, 68, 68, 0.15); color: var(--error);
      padding: 8px 11px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
      line-height: 1;
    }

    .empty-state { text-align: center; color: var(--muted); padding: 32px 16px; font-size: 0.9rem; }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: white; padding: 10px 20px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
  </style>



</head>
<body>
  <header>
    <h1>🔒 Hare Sync</h1>
    <span id="status" class="status-badge">Connexion...</span>
  </header>
  <div class="send-box">
    <div class="input-group">
      <input type="url" id="urlInput" placeholder="https://..." autocomplete="off" autocapitalize="off">
      <button class="btn-paste" id="pasteBtn" type="button" aria-label="Coller" title="Coller">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <button class="btn-send" id="sendBtn" type="button">Envoyer vers le PC</button>
  </div>
  <div class="section-header">
    <h2>Reçus du PC</h2>
    <button id="clearAllBtn" class="btn-clear-all" type="button" style="display: none;">Tout effacer</button>
  </div>
  <div id="linksList" class="links-list">
    <div class="empty-state">Aucun lien reçu pour le moment.<br>En attente de transfert Wi-Fi...</div>
  </div>
  <div id="toast">Lien envoyé !</div>
  
  <script src="/noble-crypto.js"></script>
  <script>
    if (!window.NobleCrypto) {
      console.error('[HareSync] noble-crypto.js introuvable. Verifiez /noble-crypto.js');
    }
    const { gcm, hkdf, sha256 } = window.NobleCrypto || {};

    function getRandomBytes(length) {
      const bytes = new Uint8Array(length);
      window.crypto.getRandomValues(bytes);
      return bytes;
    }

    function bufferToBase64Url(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function base64UrlToBuffer(base64Url) {
      let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function deriveAesKey(masterKey, salt) {
      const info = new TextEncoder().encode('airsift-v1-aes256gcm');
      return hkdf(sha256, masterKey, salt, info, 32);
    }

    function encryptLocal(data, secretKeyBase64Url) {
      const masterKey = base64UrlToBuffer(secretKeyBase64Url);
      const salt = getRandomBytes(16);
      const nonce = getRandomBytes(12);
      const aesKey = deriveAesKey(masterKey, salt);

      const plaintext = new TextEncoder().encode(JSON.stringify(data));
      const ciphertextWithTag = gcm(aesKey, nonce).encrypt(plaintext);

      const combined = new Uint8Array(16 + 12 + ciphertextWithTag.length);
      combined.set(salt, 0);
      combined.set(nonce, 16);
      combined.set(ciphertextWithTag, 28);

      return bufferToBase64Url(combined);
    }

    function decryptLocal(encryptedBase64Url, secretKeyBase64Url) {
      const masterKey = base64UrlToBuffer(secretKeyBase64Url);
      const combined = base64UrlToBuffer(encryptedBase64Url);

      if (combined.length < 44) {
        throw new Error('Paquet chiffré invalide ou tronqué');
      }

      const salt = combined.slice(0, 16);
      const nonce = combined.slice(16, 28);
      const ciphertextWithTag = combined.slice(28);

      const aesKey = deriveAesKey(masterKey, salt);
      const plaintext = gcm(aesKey, nonce).decrypt(ciphertextWithTag);

      return JSON.parse(new TextDecoder().decode(plaintext));
    }

    const statusEl = document.getElementById('status');
    const urlInput = document.getElementById('urlInput');
    const pasteBtn = document.getElementById('pasteBtn');
    const sendBtn = document.getElementById('sendBtn');
    const linksList = document.getElementById('linksList');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const toastEl = document.getElementById('toast');

    function initPairingSession() {
      const hash = window.location.hash;

      if (hash.startsWith('#pair=')) {
        const token = hash.slice(6);
        const [encodedPayload] = token.split('.');

        let base64 = encodedPayload.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const payload = JSON.parse(atob(base64));

        if (Date.now() > new Date(payload.expire).getTime()) {
          throw new Error('QR Code expiré');
        }

        const session = {
          roomId: payload.room,
          secretKey: payload.key,
          pairingToken: token,
        };
        localStorage.setItem('airsift_paired_session', JSON.stringify(session));
        window.history.replaceState(null, '', window.location.pathname);
        return session;
      }

      const saved = localStorage.getItem('airsift_paired_session');
      return saved ? JSON.parse(saved) : null;
    }

    let session = null;
    try {
      session = initPairingSession();
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = 'status-badge error';
    }

    const roomId = session?.roomId;
    const secretKey = session?.secretKey;

    let ws = null;
    let receivedLinks = JSON.parse(localStorage.getItem('airsift_links_' + roomId) || '[]');

    function initPairingSession() {

      const hash = window.location.hash;

      // Cas 1 : Premier scan du QR Code (#pair=encodedPayload.signature)
      if (hash.startsWith('#pair=')) {
        const token = hash.slice(6);
        const [encodedPayload] = token.split('.');

        // Décodage Base64URL du payload JSON
        let base64 = encodedPayload.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const payload = JSON.parse(atob(base64));

        // Vérification locale immédiate de l'expiration
        if (Date.now() > new Date(payload.expire).getTime()) {
          throw new Error('Ce QR Code a expiré. Générez-en un nouveau sur le PC.');
        }

        // Sauvegarde de la session appairée dans le téléphone
        const session = {
          roomId: payload.room,
          secretKey: payload.key,
          pairingToken: token, // Envoyé au serveur lors du premier 'join'
        };
        localStorage.setItem('airsift_paired_session', JSON.stringify(session));

        // Efface le jeton sensible de l'historique et de la barre d'adresse Safari
        window.history.replaceState(null, '', window.location.pathname);
        return session;
      }

      // Cas 2 : Rechargement ultérieur de la page déjà appairée
      const saved = localStorage.getItem('airsift_paired_session');
      return saved ? JSON.parse(saved) : null;

    }


    function showToast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.style.background = isError ? 'var(--error)' : 'var(--success)';
      toastEl.style.opacity = '1';
      setTimeout(() => { toastEl.style.opacity = '0'; }, 2500);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function saveLinks() {
      localStorage.setItem('airsift_links_' + roomId, JSON.stringify(receivedLinks));
    }

    // Attaché à window car <script type="module"> a sa propre portée isolée
    window.deleteLink = function(index) {
      receivedLinks.splice(index, 1);
      saveLinks();
      renderLinks();
      showToast('Lien supprimé');
    };

    function clearAllLinks() {
      receivedLinks = [];
      saveLinks();
      renderLinks();
      showToast('Liste effacée');
    }

    function renderLinks() {
      if (receivedLinks.length === 0) {
        clearAllBtn.style.display = 'none';
        linksList.innerHTML = '<div class="empty-state">Aucun lien reçu pour le moment.<br>En attente de transfert Wi-Fi...</div>';
        return;
      }

      clearAllBtn.style.display = 'inline-block';
      linksList.innerHTML = receivedLinks.map((item, index) => `
        <div class="link-card">
          <div class="link-info">
            <div class="link-title">${escapeHtml(item.title || item.url)}</div>
            <span class="link-url">${escapeHtml(item.url)}</span>
          </div>
          <div class="link-actions">
            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" class="btn-open">Ouvrir</a>
            <button type="button" class="btn-delete" onclick="deleteLink(${index})" aria-label="Supprimer">✕</button>
          </div>
        </div>
      `).join('');
    }

    clearAllBtn.addEventListener('click', clearAllLinks);

    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) urlInput.value = text;
      } catch (e) {
        showToast('Impossible de lire le presse-papiers', true);
      }
    });

    sendBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (!url) return showToast('Entrez un lien valide', true);
      if (!ws || ws.readyState !== WebSocket.OPEN) return showToast('Non connecté au PC', true);
      if (!gcm || !hkdf || !sha256) return showToast('Crypto mobile non chargée', true);

      try {
        const encrypted = encryptLocal({ items: [{ url, title: url }] }, secretKey);
        ws.send(JSON.stringify({ type: 'send', payload: encrypted }));
        urlInput.value = '';
        showToast('Lien envoyé !');
      } catch (err) {
        console.error('[HareSync] Échec chiffrement AES-GCM:', err);
        showToast('Échec du chiffrement', true);
      }
    });

    function connectWebSocket() {
      if (!roomId || !secretKey) {
        statusEl.textContent = 'Lien invalide';
        statusEl.className = 'status-badge error';
        return;
      }

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        statusEl.textContent = 'Connecté';
        statusEl.className = 'status-badge online';

        ws.send(JSON.stringify({
          type: 'join',
          roomId: roomId,
          device: 'mobile',
          pairingToken: session?.pairingToken || null,
        }));

        // Le jeton à usage unique est consommé : on le retire du stockage local
        if (session?.pairingToken) {
          delete session.pairingToken;
          localStorage.setItem('airsift_paired_session', JSON.stringify(session));
        }
      };


      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          // 1. Gestion du refus d'appairage (QR code expiré, invalide ou déjà utilisé)
          if (msg.type === 'error') {
            const errorText = msg.message || 'Accès refusé';
            console.error('[HareSync] Erreur serveur:', errorText);
            statusEl.textContent = errorText;
            statusEl.className = 'status-badge error';
            showToast(errorText, true);
            localStorage.removeItem('airsift_paired_session');
            ws.close();
            return;
          }

          // 2. Ignorer les autres types de messages
          if (msg.type !== 'encrypted_payload' || typeof msg.payload !== 'string') {
            console.warn('[HareSync] Message ignore:', msg.type);
            return;
          }

          // 3. Déchiffrement AES-256-GCM
          let decrypted;
          try {
            decrypted = decryptLocal(msg.payload, secretKey);
          } catch (err) {
            console.error('[HareSync] Échec déchiffrement AES-GCM:', err);
            showToast('Échec du déchiffrement', true);
            return;
          }

          // 4. Extraction et validation des liens
          const items = Array.isArray(decrypted?.items)
            ? decrypted.items
            : (decrypted?.url ? [decrypted] : []);
          const validItems = items.filter((item) => item && item.url);

          if (validItems.length === 0) {
            console.error('[HareSync] Payload déchiffré invalide, attendu { items: [...] }:', decrypted);
            return;
          }

          receivedLinks.unshift(...validItems);
          saveLinks();
          renderLinks();
          showToast(validItems.length === 1 ? 'Nouveau lien reçu !' : `${validItems.length} liens reçus !`);
        } catch (err) {
          console.error('[HareSync] Message WebSocket invalide:', err);
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'Déconnecté';
        statusEl.className = 'status-badge error';
        setTimeout(connectWebSocket, 3000);
      };
    }

    renderLinks();
    connectWebSocket();
  </script>
</body>
</html>
